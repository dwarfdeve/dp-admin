<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DP Admin — Order Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c120a;--bg2:#111908;--bg3:#161f0c;--bg4:#1c2710;
  --border:#253018;--border2:#304020;
  --green:#5a9e30;--green2:#4a8228;--green3:#3d6e22;
  --green-dim:#0e1c08;--green-text:#7ec84a;--green-muted:#2a4015;
  --fg:#ede8dc;--fg2:#c8bfa8;--fg3:#8a8070;--fg4:#5a5448;
  --amber:#f59e0b;--red:#dc2626;--blue:#38bdf8;
  --radius:12px;--radius-sm:8px;--radius-lg:18px;
  --gold:#f7c948;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
textarea,input,select{font-family:inherit;color:var(--fg)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── LAYOUT ────────────────────────────────────── */
.app{display:grid;grid-template-columns:380px 1fr;min-height:100vh}
@media(max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

/* ── LEFT PANEL ───────────────────────────────── */
.left{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.left-hdr{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.left-logo{width:36px;height:36px;background:var(--green3);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.left-title{font-size:15px;font-weight:800}
.left-sub{font-size:11px;color:var(--green-text);margin-top:1px}
.left-body{padding:20px;flex:1;display:flex;flex-direction:column;gap:18px}

.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--fg4);margin-bottom:8px}

.paste-box{display:flex;flex-direction:column;gap:8px}
.paste-ta{width:100%;height:200px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:12px;color:var(--fg2);resize:vertical;line-height:1.55;font-family:'JetBrains Mono',monospace}
.paste-ta:focus{outline:none;border-color:var(--green)}
.paste-ta::placeholder{color:var(--fg4)}
.parse-btn{width:100%;padding:11px;background:linear-gradient(135deg,var(--green3),var(--green2));color:#fff;border-radius:var(--radius-sm);font-size:14px;font-weight:700;transition:opacity .15s}
.parse-btn:hover{opacity:.88}

/* ── STATUS CONTROLS ─────────────────────────── */
.status-controls{display:flex;flex-direction:column;gap:8px}
.step-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);font-size:13px;font-weight:500;transition:border-color .15s,background .15s;text-align:left}
.step-btn:hover:not(:disabled){border-color:var(--border2);background:var(--bg4)}
.step-btn:disabled{opacity:.4;cursor:not-allowed}
.step-btn.active{border-color:var(--green);background:var(--green-dim);color:var(--green-text)}
.step-btn.done{border-color:var(--green-muted);opacity:.55}
.step-btn.done .step-ico{color:var(--green-text)}
.step-ico{font-size:16px;flex-shrink:0;width:22px;text-align:center}
.step-ts{font-size:10px;color:var(--fg4);margin-top:1px;font-family:'JetBrains Mono',monospace}

.pay-block{display:flex;flex-direction:column;gap:8px}
.pay-toggle{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--bg3);font-size:14px;font-weight:600;transition:all .2s}
.pay-toggle:hover{border-color:var(--green-muted)}
.pay-toggle.paid{border-color:var(--green);background:var(--green-dim);color:var(--green-text)}
.pay-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--fg4);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:all .2s}
.pay-toggle.paid .pay-check{background:var(--green);border-color:var(--green);color:#fff}
.pay-ts{font-size:11px;color:var(--green-text);font-family:'JetBrains Mono',monospace}

.note-input{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--fg2);resize:vertical;min-height:72px}
.note-input:focus{outline:none;border-color:var(--green)}

.action-btns{display:flex;flex-direction:column;gap:8px}
.print-btn{width:100%;padding:11px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:background .15s}
.print-btn:hover{background:var(--bg3)}
.clear-btn{width:100%;padding:10px;border-radius:var(--radius-sm);font-size:12px;color:var(--fg4);border:1px solid var(--border);transition:background .15s}
.clear-btn:hover{background:var(--bg3)}

/* ── RIGHT PANEL ─────────────────────────────── */
.right{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:32px 24px 60px;overflow-y:auto;background:var(--bg)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:1;text-align:center;color:var(--fg4);padding:60px 24px;min-height:400px}
.empty-icon{font-size:48px;opacity:.3}
.empty-text{font-size:15px;max-width:280px;line-height:1.6}

/* ── ORDER CARD (professional receipt) ──────────── */
.order-card{
  width:100%;max-width:680px;background:#fff;
  border-radius:6px;border:1px solid #ccc;overflow:hidden;
  box-shadow:0 8px 48px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.25);
  font-family:'Inter',sans-serif;color:#111;
}
.rc-band{height:7px;background:linear-gradient(90deg,#1a3d0a,#3d6e22,#5a9e30,#3d6e22,#1a3d0a);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rc-header{padding:18px 28px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:2px solid #111}
.rc-brand{display:flex;align-items:center;gap:10px}
.rc-brand-name{font-size:17px;font-weight:900;color:#111;letter-spacing:-.2px;line-height:1}
.rc-brand-tagline{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:#888;margin-top:3px}
.rc-doc-info{text-align:right}
.rc-doc-label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:#999}
.rc-doc-ref{font-size:24px;font-weight:900;font-family:'JetBrains Mono',monospace;color:#111;letter-spacing:1.5px;line-height:1.15}
.rc-doc-date{font-size:10px;color:#888;margin-top:3px}
.rc-status-pill{display:inline-block;padding:4px 12px;border-radius:4px;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.spl-received{background:#dbeafe;color:#1d4ed8}
.spl-confirmed{background:#fef9c3;color:#854d0e}
.spl-packed{background:#f3e8ff;color:#6b21a8}
.spl-transit{background:#fff7ed;color:#c2410c}
.spl-delivered{background:#dcfce7;color:#15803d}

.rc-barcode-row{padding:12px 28px 10px;display:flex;align-items:flex-end;gap:20px;border-bottom:1px solid #e8e8e8;background:#f9f9f9}
.rc-barcode-num{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#111;letter-spacing:3px;padding-bottom:2px}

.rc-info-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px dashed #d5d5d5}
.rc-info-col{padding:14px 28px}
.rc-info-col+.rc-info-col{border-left:1px dashed #d5d5d5}
.rc-col-label{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.18em;color:#bbb;margin-bottom:8px}
.rc-field{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#111;margin-bottom:5px}
.rc-field:last-child{margin-bottom:0}
.rc-field-ico{font-size:14px;flex-shrink:0;width:18px;text-align:center}

.rc-section{padding:14px 28px;border-bottom:1px dashed #d5d5d5}
.rc-section-title{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.18em;color:#bbb;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.rc-section-title::after{content:'';flex:1;height:1px;background:#e8e8e8}

.rc-items-header{display:grid;grid-template-columns:1fr 56px 88px;gap:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#bbb;padding-bottom:7px;border-bottom:1px solid #e5e5e5;margin-bottom:2px}
.rc-item-row{display:grid;grid-template-columns:1fr 56px 88px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #f0f0f0}
.rc-item-row:last-child{border-bottom:none}
.rc-item-name{font-size:13px;font-weight:600;color:#111}
.rc-item-qty{font-size:12px;color:#555;text-align:center}
.rc-item-price{font-size:13px;font-weight:700;color:#1a5c08;text-align:right}
.rc-total-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:2px solid #111}
.rc-total-label{font-size:12px;font-weight:900;color:#111;text-transform:uppercase;letter-spacing:.08em}
.rc-total-val{font-size:22px;font-weight:900;color:#1a5c08;font-family:'JetBrains Mono',monospace}

.rc-pay-row{padding:12px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px dashed #d5d5d5;background:#f9f9f9}
.rc-pay-method{font-size:13px;font-weight:700;color:#111;display:flex;align-items:center;gap:8px}
.rc-pay-badge{padding:5px 14px;border-radius:4px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rc-pay-pending{background:#fff8e1;color:#b45309;border:1px solid #fcd34d}
.rc-pay-paid{background:#f0fce8;color:#166534;border:1px solid #86efac}

.rc-timeline{display:flex;flex-direction:column}
.rc-tl-step{display:flex;align-items:flex-start;gap:0;position:relative}
.rc-tl-left{display:flex;flex-direction:column;align-items:center;width:34px;flex-shrink:0}
.rc-tl-node{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border:2px solid #ddd;background:#fff;color:#bbb;flex-shrink:0;position:relative;z-index:1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rc-tl-connector{width:2px;flex:1;min-height:14px;background:#e5e5e5}
.rc-tl-step:last-child .rc-tl-connector{display:none}
.rc-tl-body{padding:2px 0 16px 10px;flex:1}
.rc-tl-step:last-child .rc-tl-body{padding-bottom:0}
.rc-tl-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rc-tl-name{font-size:12px;font-weight:600;color:#bbb}
.rc-tl-time{font-size:10px;font-family:'JetBrains Mono',monospace;color:#bbb;white-space:nowrap}
.rc-tl-sub{font-size:11px;color:#ccc;margin-top:1px}
.rc-tl-step.done .rc-tl-node{background:#1a5c08;border-color:#1a5c08;color:#fff}
.rc-tl-step.done .rc-tl-connector{background:linear-gradient(to bottom,#3d6e22,#e5e5e5)}
.rc-tl-step.done .rc-tl-name{color:#111;font-weight:700}
.rc-tl-step.done .rc-tl-time{color:#3d6e22}
.rc-tl-step.done .rc-tl-sub{color:#666}
.rc-tl-step.active .rc-tl-node{background:#fff;border-color:#3d6e22;color:#1a5c08;box-shadow:0 0 0 3px rgba(61,110,34,.18)}
.rc-tl-step.active .rc-tl-name{color:#1a5c08;font-weight:800}
.rc-tl-step.active .rc-tl-time{color:#3d6e22}
.rc-tl-step.active .rc-tl-sub{color:#555}
.rc-tl-step.all-done .rc-tl-node{background:#3d6e22;border-color:#3d6e22;color:#fff;box-shadow:0 0 0 3px rgba(61,110,34,.2)}
.rc-tl-step.all-done .rc-tl-name{color:#1a5c08;font-weight:800}
.rc-tl-step.all-done .rc-tl-time{color:#3d6e22}
.rc-tl-step.all-done .rc-tl-sub{color:#555}

.rc-notes-box{background:#fffbf0;border:1px solid #fde68a;border-radius:4px;padding:10px 14px;font-size:12px;color:#444;line-height:1.55;margin-top:6px}

.rc-footer{padding:13px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rc-footer-left{display:flex;flex-direction:column;gap:5px}
.rc-footer-brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#7ec84a}
.rc-footer-ref{font-size:10px;font-family:'JetBrains Mono',monospace;color:#555}
.rc-qr-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0}
.rc-qr-box{background:#fff;padding:5px;border-radius:4px;line-height:0}
.rc-qr-box svg,.rc-qr-box table{width:80px!important;height:80px!important;display:block}
.rc-qr-label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#666}

/* ── CUSTOMER TRACKING VIEW ──────────────────── */
.customer-view{display:none;flex-direction:column;align-items:center;min-height:100vh;background:#f0f2ec;padding:36px 16px 72px}
.cv-header{width:100%;max-width:680px;margin-bottom:22px}
.cv-header-eyebrow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.18em;color:#888;margin-bottom:5px}
.cv-header-title{font-size:24px;font-weight:900;color:#111;letter-spacing:-.3px}
.cv-header-sub{font-size:13px;color:#888;margin-top:4px}
.cv-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#3d6e22;margin-bottom:20px;cursor:pointer;text-decoration:none}
.cv-back:hover{text-decoration:underline}

/* ── SHARE / ACTION BUTTONS ──────────────────── */
.share-btn{width:100%;padding:11px;background:linear-gradient(135deg,#1a3d0a,#3d6e22);color:#fff;border-radius:var(--radius-sm);font-size:13px;font-weight:700;transition:opacity .15s}
.share-btn:hover{opacity:.88}

/* ── TOAST ───────────────────────────────────── */
.dp-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:11px 22px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;z-index:9999;white-space:nowrap;pointer-events:none;border:1px solid #333}
.dp-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── PRINT / SCREENSHOT MODE ──────────────────── */
@media print{
  .left,.no-print{display:none!important}
  .app{display:block}
  .right{padding:0;background:#fff}
  body{background:#fff}
  .customer-view{background:#fff;padding:0}
  .cv-header,.cv-back{display:none!important}
  .order-card{border:none;border-radius:0;max-width:100%;box-shadow:none;width:100%}
}
</style>
</head>
<body>
<div class="customer-view" id="customer-view"></div>
<div class="dp-toast" id="dp-toast"></div>
<div class="app">

  <!-- ════════════════════════════════════════
       LEFT PANEL — controls
  ═════════════════════════════════════════ -->
  <div class="left">
    <div class="left-hdr">
      <div class="left-logo">
        <svg viewBox="0 0 100 120" fill="#fff" width="20" height="20"><path d="M50 118 L48 82 C43 83 37 85 32 83 C29 76 33 69 39 65 C33 67 26 66 21 62 C20 55 25 50 31 48 C24 46 16 43 12 37 C15 30 22 28 29 29 C24 23 22 15 24 8 C31 8 37 14 40 21 C42 13 46 7 50 4 C54 7 58 13 60 21 C63 14 69 8 76 8 C78 15 76 23 71 29 C78 28 85 30 88 37 C84 43 76 46 69 48 C75 50 80 55 79 62 C74 66 67 67 61 65 C67 69 71 76 68 83 C63 85 57 83 52 82 Z"/></svg>
      </div>
      <div>
        <div class="left-title">DP Admin</div>
        <div class="left-sub">Order Tracker — Internal Use Only</div>
      </div>
    </div>

    <div class="left-body">

      <!-- PASTE ORDER -->
      <div class="paste-box">
        <div class="section-label">Paste Order Text</div>
        <textarea class="paste-ta" id="paste-ta" placeholder="Paste the Telegram order message here...

🌿 *NEW ORDER — DP-XXXXXX*

👤 *Name:* ...
📱 *Contact:* ...
🌍 *Location:* ...
💳 *Payment:* ...

📦 *ORDER DETAILS:*
• Item × qty — $XX each

🛡️ *Insurance:* ..."></textarea>
        <button class="parse-btn" onclick="parseOrder()">⚡ Parse &amp; Load Order</button>
      </div>

      <!-- STATUS STEPS -->
      <div id="step-controls" style="display:none">
        <div class="section-label">Order Status</div>
        <div class="status-controls" id="step-btns"></div>
      </div>

      <!-- PAYMENT -->
      <div id="pay-controls" style="display:none">
        <div class="section-label">Payment</div>
        <div class="pay-block">
          <button class="pay-toggle" id="pay-toggle-btn" onclick="togglePayment()">
            <div class="pay-check" id="pay-check">✓</div>
            <div>
              <div id="pay-toggle-label">Mark Payment Received</div>
              <div class="pay-ts" id="pay-ts" style="display:none"></div>
            </div>
          </button>
        </div>
      </div>

      <!-- NOTES -->
      <!-- DATE / TIME OVERRIDE -->
      <div id="datetime-controls" style="display:none">
        <div class="section-label">Receipt Date &amp; Time</div>
        <input type="datetime-local" class="note-input" id="datetime-input" style="min-height:auto;padding:9px 12px;resize:none" oninput="updateDateTime()"/>
      </div>

      <!-- NOTES -->
      <div id="note-controls" style="display:none">
        <div class="section-label">Internal Notes</div>
        <textarea class="note-input" id="note-input" placeholder="Tracking number, notes, special instructions..." oninput="updateNotes()"></textarea>
      </div>

      <!-- ACTIONS -->
      <div id="action-controls" style="display:none" class="action-btns">
        <button class="share-btn" onclick="generateShareLink()">🔗 Copy Customer Share Link</button>
        <button class="print-btn" onclick="window.print()">🖨️ Print / Screenshot</button>
        <button class="clear-btn" onclick="clearOrder()">✕ Clear &amp; New Order</button>
      </div>

    </div>
  </div>

  <!-- ════════════════════════════════════════
       RIGHT PANEL — order card
  ═════════════════════════════════════════ -->
  <div class="right" id="right-panel">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-text">Paste a Telegram order message on the left and click <strong>Parse &amp; Load Order</strong> to generate the tracking card.</div>
    </div>
    <div id="order-card-wrap" style="display:none;width:100%;justify-content:center"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let order = null;
let paymentDone = false;
let paymentTime = null;
let currentStep = 0; // 0 = nothing parsed, 1–5 = step index
let stepTimes = [];

const STEPS = [
  { label: "Order Received",         sub: "Order submitted via shop",     icon: "📩" },
  { label: "Payment Confirmed",      sub: "Payment received & verified",  icon: "💰" },
  { label: "Packed & Sealed",        sub: "Package prepped for dispatch",  icon: "📦" },
  { label: "Dispatched / In Transit",sub: "Shipped — tracking active",    icon: "✈️" },
  { label: "Delivered",              sub: "Package received by customer", icon: "✅" }
];

const STATUS_PILLS = [
  { cls: "spl-received",  label: "Order Received"  },
  { cls: "spl-confirmed", label: "Payment Pending" },
  { cls: "spl-confirmed", label: "Processing"      },
  { cls: "spl-packed",    label: "Packed"          },
  { cls: "spl-transit",   label: "In Transit"      },
  { cls: "spl-delivered", label: "Delivered"       }
];

const PAY_ICONS = {
  "bitcoin":"₿", "crypto":"₿", "btc":"₿", "xmr":"⬡", "eth":"Ξ",
  "gift":"🎁", "gift card":"🎁", "gift cards":"🎁",
  "cash app":"💚", "cashapp":"💚",
  "western union":"🏦"
};

// ═══════════════════════════════════════════════════════
//  PARSE
// ═══════════════════════════════════════════════════════
function parseOrder() {
  const raw = document.getElementById("paste-ta").value.trim();
  if (!raw) return;

  const get = (emoji) => {
    const rx = new RegExp(emoji + "\\s*\\*?\\w[^:]*:\\*?\\s*(.+)", "i");
    const m = raw.match(rx);
    return m ? m[1].replace(/\*/g,"").trim() : null;
  };

  // Reference number
  const refMatch = raw.match(/DP-(\d{6})/i);
  const ref = refMatch ? "DP-" + refMatch[1] : "DP-??????";

  // Date: use today
  const now = new Date();
  const dateStr = now.toLocaleDateString("en-US",{weekday:"short",year:"numeric",month:"short",day:"numeric"});
  const timeStr = now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});

  // Fields
  const name     = get("👤") || "—";
  const contact  = get("📱") || "—";
  const location = get("🌍") || "—";
  const payment  = get("💳") || "—";
  const insurance= raw.match(/Insurance.*?(Yes|No)/i) ? raw.match(/Insurance.*?(Yes|No)/i)[1] : "No";

  // Notes
  const notesMatch = raw.match(/📝\s*\*?Notes:\*?\s*(.+)/i);
  const notes = notesMatch ? notesMatch[1].replace(/\*/g,"").trim() : null;

  // Items — lines starting with •
  const items = [];
  const itemLines = raw.match(/^•\s*.+/gm) || [];
  itemLines.forEach(line => {
    const clean = line.replace(/^•\s*/,"").replace(/\*/g,"").trim();
    // Try to parse: "Name (size) × qty — $price each"
    const m = clean.match(/^(.+?)\s*×\s*(\d+)\s*(?:—|–)\s*(.+?)(?:\s*each)?$/i);
    if (m) {
      items.push({ name: m[1].trim(), qty: m[2].trim(), price: m[3].trim() });
    } else {
      items.push({ name: clean, qty: "—", price: "—" });
    }
  });
  // Insurance item
  if (insurance === "Yes") items.push({ name: "🛡️ Shipping Insurance", qty: "1", price: "$20" });

  const generatedDate = now.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  order = { ref, dateStr, timeStr, name, contact, location, payment, insurance, notes, items, generatedDate };
  paymentDone = false;
  paymentTime = null;
  currentStep = 1;
  stepTimes = [now, null, null, null, null];

  renderCard();
  showControls();
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function fmtTime(d) {
  if (!d) return "";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + " " +
         d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
}

function payIcon(pm) {
  const key = pm.toLowerCase();
  for (const k in PAY_ICONS) if (key.includes(k)) return PAY_ICONS[k];
  return "💳";
}

function parsePrice(str) {
  if (!str || str === "—") return null;
  const m = str.replace(/,/g, "").match(/[\d]+\.?[\d]*/);
  return m ? parseFloat(m[0]) : null;
}

function calcTotal() {
  if (!order || !order.items.length) return null;
  let total = 0, hasAny = false;
  for (const item of order.items) {
    const p = parsePrice(item.price);
    if (p !== null) {
      total += p * (parseInt(item.qty) || 1);
      hasAny = true;
    }
  }
  return hasAny ? total : null;
}

function makeBarcodesvg(ref) {
  const str = (ref + ref).replace(/[^A-Z0-9]/gi, "").substring(0, 28);
  const rects = [];
  let x = 8;
  const H = 44;
  const bar = (w, h) => { rects.push(`<rect x="${x}" width="${w}" height="${h}" fill="#111"/>`); x += w; };
  const gap = (w) => { x += w; };
  bar(2, H); gap(1); bar(1, H); gap(1); bar(2, H); gap(2);
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i) % 96;
    const b1 = ((c >> 4) & 3) + 1;
    const s1 = ((c >> 2) & 1) + 1;
    const b2 = (c & 3) + 1;
    const s2 = ((c >> 3) & 1) + 1;
    const b3 = ((c >> 5) & 1) + 2;
    bar(b1, i % 2 === 0 ? H : H - 8); gap(s1);
    bar(b2, H); gap(s2);
    bar(b3, i % 2 === 0 ? H - 8 : H); gap(2);
  }
  bar(2, H); gap(1); bar(1, H); gap(1); bar(2, H);
  x += 8;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${x}" height="${H}" viewBox="0 0 ${x} ${H}" style="display:block;flex-shrink:0">${rects.join("")}</svg>`;
}

function buildReceiptHTML(showInternalNotes, showQR) {
  const pill = STATUS_PILLS[Math.min(currentStep, STATUS_PILLS.length - 1)];
  const internalNote = showInternalNotes && document.getElementById("note-input")
    ? document.getElementById("note-input").value.trim() : "";
  const total = calcTotal();
  const bc = makeBarcodesvg(order.ref);
  const orderItems = order.items.filter(i => i.name !== "🛡️ Shipping Insurance");

  return `
  <div class="order-card" id="order-card">

    <div class="rc-band"></div>

    <div class="rc-header">
      <div class="rc-brand">
        <svg viewBox="0 0 100 120" fill="#2d5a16" width="30" height="36"><path d="M50 118 L48 82 C43 83 37 85 32 83 C29 76 33 69 39 65 C33 67 26 66 21 62 C20 55 25 50 31 48 C24 46 16 43 12 37 C15 30 22 28 29 29 C24 23 22 15 24 8 C31 8 37 14 40 21 C42 13 46 7 50 4 C54 7 58 13 60 21 C63 14 69 8 76 8 C78 15 76 23 71 29 C78 28 85 30 88 37 C84 43 76 46 69 48 C75 50 80 55 79 62 C74 66 67 67 61 65 C67 69 71 76 68 83 C63 85 57 83 52 82 Z"/></svg>
        <div>
          <div class="rc-brand-name">DWARF PLUG</div>
          <div class="rc-brand-tagline">Official Shipment Receipt</div>
        </div>
      </div>
      <div class="rc-doc-info">
        <div class="rc-doc-label">Tracking Number</div>
        <div class="rc-doc-ref">${order.ref}</div>
        <div class="rc-doc-date">${order.dateStr} &nbsp;·&nbsp; ${order.timeStr}</div>
        <div class="rc-status-pill ${pill.cls}">${pill.label}</div>
      </div>
    </div>

    <div class="rc-barcode-row">
      ${bc}
      <div class="rc-barcode-num">${order.ref}</div>
    </div>

    <div class="rc-info-grid">
      <div class="rc-info-col">
        <div class="rc-col-label">Ship To</div>
        <div class="rc-field"><span class="rc-field-ico">👤</span>${order.name}</div>
        <div class="rc-field"><span class="rc-field-ico">📱</span>${order.contact}</div>
        <div class="rc-field"><span class="rc-field-ico">🌍</span>${order.location}</div>
      </div>
      <div class="rc-info-col">
        <div class="rc-col-label">Order Details</div>
        <div class="rc-field"><span class="rc-field-ico">📅</span>${order.dateStr}</div>
        <div class="rc-field"><span class="rc-field-ico">🕐</span>${order.timeStr}</div>
        <div class="rc-field"><span class="rc-field-ico">💳</span>${order.payment}</div>
        ${order.insurance === "Yes" ? `<div class="rc-field"><span class="rc-field-ico">🛡️</span>Insurance Included</div>` : ""}
      </div>
    </div>

    <div class="rc-section">
      <div class="rc-section-title">Order Items</div>
      <div class="rc-items-header">
        <span>Description</span><span style="text-align:center">Qty</span><span style="text-align:right">Unit Price</span>
      </div>
      ${orderItems.length ? orderItems.map(item => `
        <div class="rc-item-row">
          <div class="rc-item-name">${item.name}</div>
          <div class="rc-item-qty">${item.qty}</div>
          <div class="rc-item-price">${item.price !== "—" ? item.price : "—"}</div>
        </div>`).join("") : `<div style="color:#bbb;font-size:13px;padding:8px 0">No items parsed</div>`}
      ${order.insurance === "Yes" ? `
        <div class="rc-item-row">
          <div class="rc-item-name">🛡️ Shipping Insurance</div>
          <div class="rc-item-qty">1</div>
          <div class="rc-item-price">$20.00</div>
        </div>` : ""}
      ${total !== null ? `
        <div class="rc-total-row">
          <div class="rc-total-label">Order Total</div>
          <div class="rc-total-val">$${total.toFixed(2)}</div>
        </div>` : ""}
    </div>

    <div class="rc-pay-row">
      <div class="rc-pay-method">${payIcon(order.payment)}&nbsp;&nbsp;${order.payment}</div>
      ${paymentDone
        ? `<div class="rc-pay-badge rc-pay-paid">✓ Payment Confirmed${paymentTime ? "&nbsp;·&nbsp;" + fmtTime(paymentTime) : ""}</div>`
        : `<div class="rc-pay-badge rc-pay-pending">⏳ Awaiting Payment</div>`}
    </div>

    <div class="rc-section">
      <div class="rc-section-title">Shipping Progress</div>
      <div class="rc-timeline">
        ${STEPS.map((s, i) => {
          const idx = i + 1;
          let cls = "";
          if (idx < currentStep) cls = "done";
          else if (idx === currentStep) cls = idx === 5 ? "all-done" : "active";
          const nodeContent = (cls === "done" || cls === "all-done") ? "✓" : cls === "active" ? s.icon : String(idx);
          const ts = stepTimes[i] ? fmtTime(stepTimes[i]) : "";
          const isLast = i === STEPS.length - 1;
          return `<div class="rc-tl-step ${cls}">
            <div class="rc-tl-left">
              <div class="rc-tl-node">${nodeContent}</div>
              ${!isLast ? '<div class="rc-tl-connector"></div>' : ""}
            </div>
            <div class="rc-tl-body">
              <div class="rc-tl-row">
                <div class="rc-tl-name">${s.label}</div>
                ${ts ? `<div class="rc-tl-time">${ts}</div>` : ""}
              </div>
              <div class="rc-tl-sub">${s.sub}</div>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>

    ${(order.notes || internalNote) ? `
    <div class="rc-section">
      <div class="rc-section-title">Notes</div>
      ${order.notes ? `<div class="rc-notes-box">📝 ${order.notes}</div>` : ""}
      ${internalNote ? `<div class="rc-notes-box" style="margin-top:6px;background:#f8f8f8;border-color:#ddd">🔒 ${internalNote}</div>` : ""}
    </div>` : ""}

    <div class="rc-footer">
      <div class="rc-footer-left">
        <div class="rc-footer-brand">
          <svg viewBox="0 0 100 120" fill="currentColor" width="12" height="14"><path d="M50 118 L48 82 C43 83 37 85 32 83 C29 76 33 69 39 65 C33 67 26 66 21 62 C20 55 25 50 31 48 C24 46 16 43 12 37 C15 30 22 28 29 29 C24 23 22 15 24 8 C31 8 37 14 40 21 C42 13 46 7 50 4 C54 7 58 13 60 21 C63 14 69 8 76 8 C78 15 76 23 71 29 C78 28 85 30 88 37 C84 43 76 46 69 48 C75 50 80 55 79 62 C74 66 67 67 61 65 C67 69 71 76 68 83 C63 85 57 83 52 82 Z"/></svg>
          Dwarf Plug Shipping Agency
        </div>
        <div class="rc-footer-ref">${order.ref} · Generated ${order.generatedDate}</div>
      </div>
      ${showQR ? `<div class="rc-qr-wrap"><div class="rc-qr-box" id="rc-qr-code"></div><div class="rc-qr-label">Scan to track</div></div>` : ""}
    </div>

  </div>`;
}

function renderCard() {
  if (!order) return;
  const wrap = document.getElementById("order-card-wrap");
  wrap.innerHTML = buildReceiptHTML(true, true);
  wrap.style.display = "flex";
  document.getElementById("empty-state").style.display = "none";
  injectQRCode("rc-qr-code", generateShareURL());
}

// ═══════════════════════════════════════════════════════
//  SHARE LINK
// ═══════════════════════════════════════════════════════
function generateShareURL() {
  if (!order) return null;
  const data = {
    ...order,
    step: currentStep,
    paymentDone,
    paymentTime: paymentTime ? paymentTime.toISOString() : null,
    stepTimes: stepTimes.map(t => t ? t.toISOString() : null)
  };
  try {
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    return location.origin + location.pathname + "#dp=" + encoded;
  } catch(e) {
    return null;
  }
}

function generateShareLink() {
  const url = generateShareURL();
  if (!url) return;
  navigator.clipboard.writeText(url).then(() => {
    showToast("✓ Share link copied — send it to your customer");
  }).catch(() => {
    prompt("Copy this tracking link:", url);
  });
}

function injectQRCode(targetId, url) {
  const el = document.getElementById(targetId);
  if (!el || !url) return;
  if (typeof qrcode === "undefined") { el.parentElement && (el.parentElement.style.display = "none"); return; }
  for (let t = 6; t <= 40; t++) {
    try {
      const qr = qrcode(t, "L");
      qr.addData(url);
      qr.make();
      el.innerHTML = qr.createSvgTag(1, 0);
      const svg = el.querySelector("svg");
      if (svg) { svg.setAttribute("width", "80"); svg.setAttribute("height", "80"); }
      return;
    } catch(e) { continue; }
  }
  el.parentElement && (el.parentElement.style.display = "none");
}

function showToast(msg) {
  const t = document.getElementById("dp-toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

// ═══════════════════════════════════════════════════════
//  CUSTOMER VIEW (loaded from share link)
// ═══════════════════════════════════════════════════════
function loadFromHash() {
  const hash = location.hash;
  if (!hash.startsWith("#dp=")) return;
  try {
    const raw = JSON.parse(decodeURIComponent(escape(atob(hash.slice(4)))));
    order = {
      ref: raw.ref, dateStr: raw.dateStr, timeStr: raw.timeStr,
      name: raw.name, contact: raw.contact, location: raw.location,
      payment: raw.payment, insurance: raw.insurance,
      notes: raw.notes, items: raw.items || [], generatedDate: raw.generatedDate
    };
    currentStep = raw.step || 1;
    paymentDone = !!raw.paymentDone;
    paymentTime = raw.paymentTime ? new Date(raw.paymentTime) : null;
    stepTimes = (raw.stepTimes || []).map(t => t ? new Date(t) : null);
    showCustomerView();
  } catch(e) {
    console.error("Invalid share link", e);
  }
}

function showCustomerView() {
  document.querySelector(".app").style.display = "none";
  const cv = document.getElementById("customer-view");
  cv.style.display = "flex";
  const pill = STATUS_PILLS[Math.min(currentStep, STATUS_PILLS.length - 1)];
  cv.innerHTML = `
    <div class="cv-header">
      <div class="cv-header-eyebrow">📦 Order Tracking</div>
      <div class="cv-header-title">${order.ref}</div>
      <div class="cv-header-sub">Live shipment status &nbsp;·&nbsp; <strong style="color:#3d6e22">${pill.label}</strong></div>
    </div>
    ${buildReceiptHTML(false, false)}
  `;
}

window.addEventListener("DOMContentLoaded", loadFromHash);

// ═══════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════
function showControls() {
  ["step-controls","pay-controls","datetime-controls","note-controls","action-controls"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "block";
  });
  // Pre-fill datetime input with the order's parsed time
  const dtInput = document.getElementById("datetime-input");
  if (dtInput && order) {
    const now = new Date();
    const pad = n => String(n).padStart(2, "0");
    dtInput.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }
  renderStepBtns();
  updatePayBtn();
}

function renderStepBtns() {
  const container = document.getElementById("step-btns");
  container.innerHTML = STEPS.map((s, i) => {
    const idx = i + 1;
    let cls = "";
    if (idx < currentStep) cls = "done";
    else if (idx === currentStep) cls = "active";
    else cls = "";
    const ts = stepTimes[i] ? `<div class="step-ts">${fmtTime(stepTimes[i])}</div>` : "";
    const disabled = idx < currentStep || idx > currentStep + 1 ? "disabled" : "";
    return `<button class="step-btn ${cls}" ${disabled} onclick="setStep(${idx})">
      <span class="step-ico">${s.icon}</span>
      <div style="flex:1;min-width:0">
        <div>${s.label}</div>
        ${ts}
      </div>
      ${cls==="done" ? '<span style="color:var(--green-text);font-size:12px">✓</span>' : ""}
      ${cls==="active" ? '<span style="color:var(--green-text);font-size:10px">NOW</span>' : ""}
    </button>`;
  }).join("");
}

function setStep(idx) {
  if (!order) return;
  // If stepping forward, record time
  if (idx > currentStep) {
    for (let i = currentStep; i < idx; i++) {
      if (!stepTimes[i]) stepTimes[i] = new Date();
    }
  }
  currentStep = idx;
  // Auto-confirm payment when step 2 is set
  if (idx >= 2 && !paymentDone) {
    paymentDone = true;
    paymentTime = new Date();
    updatePayBtn();
  }
  renderStepBtns();
  renderCard();
}

function togglePayment() {
  if (!order) return;
  paymentDone = !paymentDone;
  paymentTime = paymentDone ? new Date() : null;
  // Advance to step 2 if payment confirmed and still on step 1
  if (paymentDone && currentStep === 1) {
    currentStep = 2;
    stepTimes[1] = paymentTime;
    renderStepBtns();
  }
  updatePayBtn();
  renderCard();
}

function updatePayBtn() {
  const btn = document.getElementById("pay-toggle-btn");
  const lbl = document.getElementById("pay-toggle-label");
  const ts  = document.getElementById("pay-ts");
  if (!btn) return;
  if (paymentDone) {
    btn.classList.add("paid");
    lbl.textContent = "✓ Payment Confirmed";
    ts.textContent = fmtTime(paymentTime);
    ts.style.display = "block";
  } else {
    btn.classList.remove("paid");
    lbl.textContent = "Mark Payment Received";
    ts.style.display = "none";
  }
}

function updateNotes() {
  if (order) renderCard();
}

function updateDateTime() {
  if (!order) return;
  const input = document.getElementById("datetime-input");
  if (!input || !input.value) return;
  const d = new Date(input.value);
  if (isNaN(d.getTime())) return;
  order.dateStr = d.toLocaleDateString("en-US", {weekday:"short",year:"numeric",month:"short",day:"numeric"});
  order.timeStr = d.toLocaleTimeString("en-US", {hour:"2-digit",minute:"2-digit"});
  order.generatedDate = d.toLocaleDateString("en-US", {month:"short",day:"numeric",year:"numeric"});
  renderCard();
}

function clearOrder() {
  order = null;
  paymentDone = false;
  paymentTime = null;
  currentStep = 0;
  stepTimes = [];
  document.getElementById("paste-ta").value = "";
  document.getElementById("note-input").value = "";
  document.getElementById("order-card-wrap").style.display = "none";
  document.getElementById("empty-state").style.display = "flex";
  ["step-controls","pay-controls","datetime-controls","note-controls","action-controls"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  });
}
</script>
